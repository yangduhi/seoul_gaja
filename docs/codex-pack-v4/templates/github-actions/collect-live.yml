name: collect-seoul-crowd-live

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-crowd-live-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r collector/requirements.txt
      - name: Collect and validate 121-place snapshot
        env:
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          APP_TIMEZONE: Asia/Seoul
        run: >-
          python -m collector.cli collect
          --catalog data/seoul-places.json
          --output "$RUNNER_TEMP/snapshot.json"
          --receipt "$RUNNER_TEMP/collect-receipt.json"
      - name: Push idempotent snapshot
        env:
          SITE_INGEST_URL: ${{ secrets.SITE_INGEST_URL }}
          SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
        run: >-
          python -m collector.cli push
          --input "$RUNNER_TEMP/snapshot.json"
          --url "$SITE_INGEST_URL"
          --token-env SITE_INGEST_TOKEN
      - name: Upload non-secret receipt on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/collect-receipt.json
          if-no-files-found: ignore
          retention-days: 14
