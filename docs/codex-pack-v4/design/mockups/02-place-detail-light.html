<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Place detail</title><style>
:root{
  --bg:#eef3fb; --ink:#0d1726; --muted:#657387; --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.82); --line:rgba(255,255,255,.68); --shadow:0 18px 50px rgba(31,48,73,.16);
  --blue:#0a84ff; --green:#34c759; --cyan:#5ac8fa; --amber:#ff9f0a; --red:#ff453a; --purple:#8e7dff;
  --r-sm:14px; --r-md:20px; --r-lg:28px; --r-xl:36px;
}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--ink)}
body{background:linear-gradient(145deg,#eaf3ff 0%,#f8f2ff 48%,#edf9f7 100%)}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:
 radial-gradient(circle at 10% 5%,rgba(10,132,255,.22),transparent 28%),
 radial-gradient(circle at 90% 30%,rgba(142,125,255,.18),transparent 34%),
 radial-gradient(circle at 30% 100%,rgba(52,199,89,.13),transparent 30%)}
.dark{--bg:#09101d;--ink:#f7f9fc;--muted:#9ba9bd;--glass:rgba(18,27,43,.58);--glass-strong:rgba(20,29,45,.84);--line:rgba(255,255,255,.13);--shadow:0 22px 60px rgba(0,0,0,.35);background:#07101d}
.dark.app{background:
 radial-gradient(circle at 15% 0%,rgba(10,132,255,.28),transparent 35%),
 radial-gradient(circle at 95% 30%,rgba(142,125,255,.22),transparent 38%),
 radial-gradient(circle at 20% 100%,rgba(52,199,89,.14),transparent 35%),#07101d}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%)}
.glass-strong{background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(30px) saturate(150%)}
.statusbar{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:700;position:relative;z-index:10}
.status-icons{letter-spacing:2px;font-size:12px}
.header{position:relative;z-index:10;padding:8px 18px 0;display:flex;align-items:center;justify-content:space-between}
.header h1{margin:0;font-size:28px;letter-spacing:-1.2px}.header .meta{font-size:12px;color:var(--muted);margin-top:3px}.circle-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.search{height:48px;margin:16px 18px 10px;border-radius:18px;display:flex;align-items:center;padding:0 15px;gap:10px;position:relative;z-index:10;color:var(--muted);font-size:14px}.search b{color:var(--ink);font-weight:600}.spacer{flex:1}.pill{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap;border:1px solid rgba(255,255,255,.55)}
.pill.active{color:white;background:linear-gradient(135deg,#0a84ff,#5d5ce2);box-shadow:0 8px 22px rgba(10,132,255,.25)}
.chips{display:flex;gap:7px;overflow:hidden;padding:2px 18px 11px;position:relative;z-index:10}
.map{position:absolute;inset:0;background:linear-gradient(150deg,#cfe4ee,#edf0da 55%,#d9e6ee);overflow:hidden}.map:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.08),rgba(232,241,250,.25) 58%,rgba(238,243,249,.95) 84%)}
.map svg{position:absolute;inset:0;width:100%;height:100%;opacity:.74}.road{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}.road.secondary{stroke-width:2;opacity:.75}.river{fill:none;stroke:#a3d4ed;stroke-width:34;opacity:.9}
.marker{position:absolute;width:30px;height:30px;border-radius:16px 16px 16px 5px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 16px rgba(31,46,67,.24);z-index:4}.marker span{transform:rotate(45deg);font-size:9px;color:white;font-weight:900}.m-green{background:var(--green)}.m-cyan{background:var(--cyan)}.m-amber{background:var(--amber)}.m-red{background:var(--red)}
.legend{position:absolute;left:18px;right:18px;top:194px;height:44px;border-radius:18px;z-index:8;display:flex;align-items:center;justify-content:space-around;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.sheet{position:absolute;z-index:9;left:10px;right:10px;bottom:9px;border-radius:30px;padding:10px 12px 14px;max-height:58%;overflow:hidden}.handle{width:42px;height:5px;background:rgba(117,130,148,.35);border-radius:99px;margin:2px auto 12px}.sheet-title{display:flex;align-items:flex-end;justify-content:space-between;padding:0 5px 8px}.sheet-title h2{margin:0;font-size:21px;letter-spacing:-.6px}.sheet-title small{color:var(--muted)}
.place{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:17px}.place+.place{border-top:1px solid rgba(100,115,138,.12)}.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:white;font-size:12px;font-weight:800;background:linear-gradient(135deg,#0a84ff,#6563e8)}.place-main{min-width:0;flex:1}.place-main b{font-size:15px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.crowd{font-size:11px;font-weight:800;padding:5px 8px;border-radius:9px}.crowd.green{color:#118a37;background:rgba(52,199,89,.13)}.crowd.amber{color:#b66500;background:rgba(255,159,10,.15)}.crowd.red{color:#c92c25;background:rgba(255,69,58,.14)}
.nav{height:70px;position:absolute;bottom:0;left:0;right:0;z-index:12;display:flex;justify-content:space-around;align-items:center;padding-bottom:9px;background:linear-gradient(to top,rgba(245,248,252,.96),rgba(245,248,252,.73));backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.75)}.dark .nav{background:linear-gradient(to top,rgba(8,14,24,.96),rgba(8,14,24,.74));border-color:rgba(255,255,255,.1)}.navitem{text-align:center;font-size:10px;color:var(--muted)}.navitem i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.navitem.on{color:var(--blue);font-weight:800}
.card{border-radius:24px;padding:16px}.section{padding:0 18px}.row{display:flex;align-items:center;justify-content:space-between}.big{font-size:34px;font-weight:850;letter-spacing:-1.6px}.muted{color:var(--muted)}.caption{font-size:11px;color:var(--muted)}.title{font-size:18px;font-weight:850;letter-spacing:-.5px}.label{font-size:12px;font-weight:750}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{text-align:center;padding:13px 5px;border-radius:18px;background:rgba(255,255,255,.44);border:1px solid rgba(255,255,255,.65)}.dark .metric{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09)}.metric i{font-style:normal;font-size:20px}.metric b{display:block;font-size:13px;margin-top:6px}.metric span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.btn{height:46px;border-radius:16px;border:0;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}.btn.primary{color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);box-shadow:0 10px 28px rgba(10,132,255,.25)}.btn.secondary{background:rgba(255,255,255,.54);color:var(--ink);border:1px solid var(--line)}.dark .btn.secondary{background:rgba(255,255,255,.07)}
.chart{width:100%;height:130px}.chart path.line{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:url(#grad)}.chart text{font-size:9px;fill:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}.recommend{display:flex;gap:12px;padding:14px;border-radius:22px;align-items:center}.thumb{width:62px;height:62px;border-radius:19px;background:linear-gradient(145deg,#8bd4ff,#8be2b2);display:grid;place-items:center;font-size:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}.score{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:white;background:linear-gradient(135deg,#34c759,#15a867)}
.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:4px;font-size:9px;align-items:center}.heat .cell{height:26px;border-radius:7px}.h0{background:rgba(52,199,89,.18)}.h1{background:rgba(52,199,89,.45)}.h2{background:rgba(255,204,0,.55)}.h3{background:rgba(255,159,10,.7)}.h4{background:rgba(255,69,58,.72)}
.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:rgba(10,132,255,.12);color:var(--blue)}
.desktop{display:grid;grid-template-columns:390px 1fr 410px;height:100%;gap:14px;padding:14px}.pane{border-radius:30px;overflow:hidden;position:relative}.desktop .map-pane{background:linear-gradient(150deg,#cfe5f4,#e9f1df 55%,#d5e4ef)}
.desk-header{padding:18px 18px 8px}.desk-header h1{margin:0;font-size:25px}.map-title{position:absolute;top:20px;left:20px;right:20px;border-radius:22px;padding:14px;z-index:8;display:flex;justify-content:space-between;align-items:center}.detail-stack{padding:18px;display:flex;flex-direction:column;gap:12px;height:100%;overflow:hidden}
</style></head><body><main class="app">
<div class="statusbar"><span>9:41</span><span class="status-icons">● ◔ ▰</span></div>
<div class="header"><div class="circle-btn glass">‹</div><div style="text-align:center"><div class="title">광화문·덕수궁</div><div class="meta">14:30 원천 기준</div></div><div class="circle-btn glass">☆</div></div>
<div class="section" style="padding-top:16px"><div class="card glass-strong" style="background:linear-gradient(135deg,rgba(255,198,104,.58),rgba(255,255,255,.72))"><div class="row"><span class="crowd amber">약간 붐빔</span><span class="badge">15분 전 갱신</span></div><div class="big" style="margin-top:12px">8,100~9,200명</div><div class="caption" style="margin-top:4px">추정 범위 · 실제 현장과 차이가 있을 수 있음</div><div class="row" style="margin-top:18px"><div><div class="label">가면 좋은 시간</div><div class="title" style="margin-top:5px">18:00 이후</div></div><div class="score">18시</div></div></div></div>
<div class="section" style="margin-top:12px"><div class="card glass"><div class="row"><div><div class="title">12시간 혼잡도 예측</div><div class="caption">서울시 공식 예측 · 자체 보간 없음</div></div><span class="badge">예측</span></div>
<svg class="chart" viewBox="0 0 360 130"><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".30"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs><path class="area" d="M10 52 L55 48 L100 62 L145 75 L190 88 L235 82 L280 94 L335 98 L335 118 L10 118 Z"/><path class="line" d="M10 52 L55 48 L100 62 L145 75 L190 88 L235 82 L280 94 L335 98"/><g fill="#fff" stroke="#0a84ff" stroke-width="3"><circle cx="10" cy="52" r="4"/><circle cx="55" cy="48" r="4"/><circle cx="100" cy="62" r="4"/><circle cx="145" cy="75" r="4"/><circle cx="190" cy="88" r="4"/><circle cx="235" cy="82" r="4"/><circle cx="280" cy="94" r="4"/><circle cx="335" cy="98" r="4"/></g><text x="8" y="128">현재</text><text x="93" y="128">18시</text><text x="183" y="128">22시</text><text x="272" y="128">02시</text><text x="325" y="128">06시</text></svg></div></div>
<div class="section" style="margin-top:12px"><div class="grid4"><div class="metric glass"><i>🅿</i><b>835면</b><span>주차 여유</span></div><div class="metric glass"><i>🚲</i><b>44대</b><span>따릉이</span></div><div class="metric glass"><i>⚠</i><b>1건</b><span>사고·통제</span></div><div class="metric glass"><i>🎁</i><b>12건</b><span>행사</span></div></div></div>
<div class="section" style="margin-top:12px"><div class="grid2"><button class="btn secondary">카카오맵</button><button class="btn secondary">네이버지도</button></div><button class="btn primary" style="width:100%;margin-top:10px">가족에게 공유</button></div>
<div class="nav"><div class="navitem on"><i>⌖</i>지도</div><div class="navitem"><i>≡</i>목록</div><div class="navitem"><i>♡</i>저장</div><div class="navitem"><i>⚙</i>설정</div></div>
</main></body></html>
