name: backfill-seoul-crowd-aggregates

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Asia/Seoul date in strict YYYY-MM-DD form
        required: true
        type: string
      end_date:
        description: Asia/Seoul date in strict YYYY-MM-DD form
        required: true
        type: string
      dry_run:
        description: Validate only
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: seoul-crowd-manual-backfill
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      start_date: ${{ steps.range.outputs.start_date }}
      end_date: ${{ steps.range.outputs.end_date }}
      dry_run: ${{ steps.dispatch.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - id: range
        name: Reject malformed or oversized dates before secrets
        env:
          BACKFILL_START_DATE: ${{ inputs.start_date }}
          BACKFILL_END_DATE: ${{ inputs.end_date }}
        run: node scripts/validate_backfill_inputs.mjs --github-output "$GITHUB_OUTPUT"
      - id: dispatch
        name: Preserve the typed dry-run input
        env:
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
        run: echo "dry_run=$BACKFILL_DRY_RUN" >> "$GITHUB_OUTPUT"

  ingest:
    needs: validate-inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-ingest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.11"
      - name: Install hash-locked collector dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r collector/requirements.lock"
      - name: Ingest validated backfill
        env:
          BACKFILL_START_DATE: ${{ needs.validate-inputs.outputs.start_date }}
          BACKFILL_END_DATE: ${{ needs.validate-inputs.outputs.end_date }}
          BACKFILL_DRY_RUN: ${{ needs.validate-inputs.outputs.dry_run }}
          SITE_INGEST_URL: ${{ secrets.SITE_INGEST_URL }}
          SITE_INGEST_PATH: /api/internal/ingest/snapshot
          SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
        run: >-
          python -m collector.cli backfill
          --base-url "$SITE_INGEST_URL"
          --path "$SITE_INGEST_PATH"
          --token-env SITE_INGEST_TOKEN
          --start "$BACKFILL_START_DATE"
          --end "$BACKFILL_END_DATE"
          --dry-run "$BACKFILL_DRY_RUN"
